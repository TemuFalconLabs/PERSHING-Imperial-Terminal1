const route=['PLAY 1','MOUNT CYLINDER','PLAY 2','CONNECT SERVER','PLAY 3','MOUNT DIRECTOR','PLAY 4','AUTH','PLAY 5','RELAY 1','RELAY 2','ENTER LAB','PLAY 6','POWER ARCHIVE','RETRIEVE CLONE BATCH SIGMA','INSERT CLONE BATCH SIGMA','PLAY 7','BEGIN CRISIS'];

const stages=['Duty station','Duty station','Cylinder interface','Server link','Network archive','Director’s office','Personal cylinder','Authorization','Research index','Engineering','Decontamination','Laboratory access','Laboratory','Archive vault','Tape elevator','Primary reader','Classified archive','Emergency signal','Emergency response'];

function fresh(campaign='MEN'){return {version:1,campaign,step:0,revision:0,room:'Reception',doors:{Vestibule:'OPEN','Service passage':'CLOSED','Lab corridor':'OPEN','Analysis door':'CLOSED','Plant hatch':'OPEN'},deck:'Primary',seen:{},playing:0,retrieved:{},parts:false,repaired:false,fast:false,mute:false,hold:false,equipment:false,legacy:false,boardAid:false,saved:{},hint:'',notice:'LOCAL DUTY STATION',danger:0,log:[]}}
function normalize(s){return {...fresh(s.campaign),...s,log:Object.values(s.log||{}),retrieved:s.retrieved||{},seen:s.seen||{},saved:s.saved||{}}}
function validSave(s){return s?.version===1&&['MEN','KIDS'].includes(s.campaign)&&Number.isInteger(s.step)&&s.step>=0&&s.step<=18&&Object.hasOwn(rooms,s.room)&&Object.keys(fresh().doors).every(k=>['OPEN','CLOSED','OBSTRUCTED'].includes(s.doors?.[k]))}
const scans=s=>s.campaign==='MEN'?adultScans:kidScans;
const locallyClosed=s=>rooms[s.room].every(d=>s.doors[d]==='CLOSED');
function apply(raw,who,action,arg='',now=Date.now()){
 const s=structuredClone(normalize(raw)),dm=who==='DM',next=route[s.step];
 const need=(ok,msg='Operation unavailable at this station.')=>{if(!ok)throw Error(msg)};
 const advance=()=>{s.step++;s.hint=''};
 let note='';
 if(action==='PLAY'){
   const id=Number(arg);need(s.deck==='Primary'&&recordings[id]&&s.step>=recordingAt[id]);
   if(id===7)need(locallyClosed(s),'Confidential playback withheld. Inspect DOORS.');
   need(!s.playing||s.playing===id,'A recording is in progress.');s.playing=id;note='Playback · '+recordings[id][0];
 }else if(action==='FINISH'){
   const id=Number(arg);need(id&&id===s.playing);s.seen[id]=true;s.playing=0;
   if(next==='PLAY '+id)advance();note=id===7?'BIOHAZARD ALERT · Airborne contaminant detected. Stand by.':'Playback complete. Archive index synchronized.';
 }else if(action==='AUTH'){
   need(next==='AUTH'&&arg===code.prefix+code.board,'Authorization denied. Review registered media.');
   advance();note='Authorization accepted. Research index expanded. Laboratory safety interlock active.';
 }else if(physical.includes(action)){
   need(dm&&next===action);if(action==='BEGIN CRISIS')need(!s.hold,'Release the crisis hold first.');
   advance();note=({'MOUNT CYLINDER':'Cylinder mounted. Recovered recording available.','CONNECT SERVER':'Server link restored. Remote index synchronized.','MOUNT DIRECTOR':'Omega media mounted. Personal recording recovered.','RELAY 1':'Environmental relay 1 online. Interlock 1 of 2.','RELAY 2':'Occupational safety check complete. Your safety is our priority.','ENTER LAB':'Local laboratory archive detected.','POWER ARCHIVE':'Retrieval station online. External power restored. No technical fault detected.','BEGIN CRISIS':'SPECIMEN ACTIVITY · Fall back to the exit junction. Surface and cave routes available.'})[action];
   if(action==='RELAY 2')s.danger=now;if(action==='POWER ARCHIVE')s.deck='Archive';
 }else if(action==='DECK'){need(s.step>=13&&['Archive','Primary'].includes(arg)&&!s.playing);s.deck=arg;note=arg==='Archive'&&s.step<14?'No carrier. Display dark.':arg+' station selected.';
 }else if(action==='RETRIEVE'){need(s.step>=14&&s.deck==='Archive'&&Object.hasOwn(tapes,arg));s.retrieved[arg]=true;if(next==='RETRIEVE '+arg)advance();note='Lift aligned. Carrier delivered: '+arg+'. Take physical tape.';
 }else if(action==='INSERT'){need(s.deck==='Primary'&&s.retrieved[arg]&&Object.hasOwn(tapes,arg));if(next==='INSERT '+arg)advance();note=arg==='CLONE BATCH SIGMA'?'Tape authenticated. Specimen records decrypted.':tapes[arg];
 }else if(action==='CLOSE'){need(s.step>=8);for(const d of rooms[s.room])if(s.doors[d]!=='OBSTRUCTED')s.doors[d]='CLOSED';note=locallyClosed(s)?'Current room closed. Doors remain unlocked.':'Obstruction detected. Check current-room door list.';
 }else if(action==='DOOR'){const [d,v]=arg.split('|');need(dm&&Object.hasOwn(s.doors,d)&&['OPEN','CLOSED','OBSTRUCTED'].includes(v));s.doors[d]=v;note=d+' · '+v;
 }else if(action==='ROOM'){need(dm&&Object.hasOwn(rooms,arg));s.room=arg;note='Local interface moved to '+arg;
 }else if(action==='BLUE'){s.legacy=true;note='THIS IS AN OLDER CODE, BUT IT CHECKS OUT. Legacy duty circular available.';
 }else if(action==='EQUIPMENT'){need(s.step>=8);s.equipment=true;note='Security Equipment Room released.';
 }else if(action==='PARTS'){need(dm&&s.step>=8);s.parts=true;note='Instrument consignment received.';
 }else if(action==='REPAIR'){need(dm&&s.step>=12&&s.parts);s.repaired=true;note='Analysis bench calibrated. Sample reader ready.';
 }else if(action==='SCAN'||action==='SAVE SCAN'){need(s.repaired&&Object.hasOwn(scans(s),arg));if(action==='SAVE SCAN')s.saved[arg]=true;note=action==='SCAN'?arg+' · '+scans(s)[arg]:'Sample filed in this session.';
 }else if(action==='HINT'){need(dm&&clues[s.step]&&[0,1,2].includes(+arg));s.hint=clues[s.step][+arg];note=s.hint;
 }else if(action==='BOARD AID'){need(dm&&s.step>=4);s.boardAid=true;note='Accessible board description enabled during frame playback.';
 }else if(['fast','mute','hold'].includes(action)){need(dm);s[action]=!s[action];note='Operator setting updated.';
 }else throw Error('Unknown operation.');
 s.notice=note;s.revision++;s.log=[...s.log.slice(-59),{at:now,who,action:action==='AUTH'?'Authorization accepted':action,detail:action==='AUTH'?'':String(arg)}];return s;
}


const config={apiKey:'AIzaSyCoeR3eJ_2kQsRfXi_c2c4MTS4GSpl2STg',authDomain:'pershing-imperial-terminal.firebaseapp.com',databaseURL:'https://pershing-imperial-terminal-default-rtdb.firebaseio.com',projectId:'pershing-imperial-terminal',storageBucket:'pershing-imperial-terminal.firebasestorage.app',messagingSenderId:'126649528532',appId:'1:126649528532:web:6b7c1df73178283e3b8b41'};

const newCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),n=>letters[n%letters.length]).join('');
const cacheKey=(code)=>'pershing.v1.dm.'+code;
const publicView=s=>{const {log,danger,hold,...view}=s;return view};
function save(code,s){localStorage.setItem(cacheKey(code),JSON.stringify(s))}
function change(session,role,action,arg,now){
 let old=normalize(session.state),s;
 if(['RESET','UNDO','IMPORT','ADVANCE'].includes(action)){
   if(role!=='DM')throw Error('Operator access required.');
   if(action==='RESET')s=fresh(old.campaign);
   if(action==='UNDO')s=session.previous;
   if(action==='IMPORT')s=JSON.parse(arg);
   if(action==='ADVANCE'){
     if(old.step>=17)throw Error('Use crisis controls.');
     s={...old,step:old.step+1,playing:0,hint:''};
     if(s.step===11)s.danger=now;
     if(s.step===14)s.deck='Archive';
   }
   if(!validSave(s)||s.campaign!==old.campaign)throw Error('Checkpoint unavailable or belongs to a different campaign.');
   s=normalize(s);s.revision=old.revision+1;s.notice='Station checkpoint synchronized.';
   s.log=[...old.log.slice(-59),{at:now,who:role,action,detail:'Operator checkpoint'}];
 }else s=apply(old,role,action,arg,now);
 const checkpoints=action==='RESET'?{}:{...session.checkpoints};
 if(old.step===10&&s.step===11)checkpoints.beforeCirculation=old;
 if(old.step===16&&action==='PLAY'&&Number(arg)===7)checkpoints.beforeTransmission=old;
 return {...session,checkpoints,previous:old,state:s,view:publicView(s)};
}
function localSession(campaign,source,update){
 let id=source?'LOCAL-'+source:'LOCAL-'+campaign;
 let restored=JSON.parse(localStorage.getItem(cacheKey(source||id))||'null');
 if(restored&&!validSave(restored))throw Error('Invalid saved checkpoint.');
 let data={state:normalize(restored||fresh(campaign))};
 const refresh=()=>{save(id,data.state);if(data.checkpoints)localStorage.setItem(cacheKey(id)+'.checkpoints',JSON.stringify(data.checkpoints));update(data.state,{code:id,local:true,connected:true,peer:false})};
 data.checkpoints=JSON.parse(localStorage.getItem(cacheKey(source||id)+'.checkpoints')||'{}');
 refresh();
 return {send:async(action,arg='',actor='DM')=>{data=change(data,actor,action,arg,Date.now());refresh()}};
}
async function networkSession({dm,code,campaign,create,emulate,update,error}){
 const f=await import('./sdk.mjs');
 const app=f.initializeApp(emulate?{...config,projectId:'demo-pershing',databaseURL:'https://demo-pershing-default-rtdb.firebaseio.com'}:config);
 const auth=f.getAuth(app),db=f.getDatabase(app);
 if(emulate){
   if(!['localhost','127.0.0.1'].includes(location.hostname))throw Error('Emulator requires localhost.');
   f.connectAuthEmulator(auth,'http://127.0.0.1:9099',{disableWarnings:true});f.connectDatabaseEmulator(db,'127.0.0.1',9000);
 }
 await auth.authStateReady();const uid=(auth.currentUser|| (await f.signInAnonymously(auth)).user).uid;
 const path='pershingV1/'+code, at=s=>f.ref(db,path+(s?'/'+s:''));
 if(create){const state=fresh(campaign);await f.set(at(''),{owner:uid,state,view:publicView(state),hostOnline:false});}
 else if(dm){if((await f.get(at('owner'))).val()!==uid)throw Error('Use the browser profile that created this session.');}
 else {try{await f.set(at('seat'),uid)}catch(e){if((await f.get(at('seat'))).val()!==uid)throw e}}
 let state=null,online=false,peer=false,busy=false;
 const show=()=>{if(state)update(normalize(state),{code,connected:online,peer,local:false})};
 f.onValue(f.ref(db,'.info/connected'),async snap=>{
   online=snap.val()===true;show();if(!online)return;
   const presence=at(dm?'hostOnline':'playerOnline');
   try{await f.onDisconnect(presence).set(false);await f.set(presence,true)}catch(e){error(e.message)}
 });

   })}catch(e){error(e.message)}
 },e=>error(e.message));

   if(!online||(!dm&&!peer))throw Error('Connection interrupted. Wait for both stations.');

}

async function command(value){

 }
 if(['AUTH BLUE','CODE BLUE','CODE CLEARANCE BLUE','AUTHORIZATION CODE BLUE'].includes(v))return act('BLUE');
 if(v.startsWith('AUTH '))return act('AUTH',v.slice(5));
 if(v==='DIR'||v==='HOME')return selectPage('Home');
 if(v==='HELP')return selectPage('Help');if(v==='STATUS')return selectPage('Status');if(v==='DOORS')return selectPage('Doors');

   const doc=Object.keys(files(s)).find(k=>k.toUpperCase()===path);if(doc)return selectPage('Read',doc);
 }
 const m=v.match(/^(?:PLAY|REPLAY) (?:REC-)?0*([1-7])$/);if(m){if(+m[1]===1&&!s.seen[1]&&page!=='Research Recordings')throw Error('Select the local recording directory first.');return act('PLAY',m[1])}
 if(v==='ARCHIVE')return act('DECK','Archive');if(v.startsWith('INSERT '))return act('INSERT',v.slice(7));
 if(v.startsWith('SCAN ')&&s.repaired){let key=Object.keys(scans(s)).find(k=>k.toUpperCase()===v.slice(5).replace(/^TODD$/,'T0DD'));if(key)return scan(key)}

}
